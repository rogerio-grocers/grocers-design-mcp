<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="padding:18px 22px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:stretch;justify-items:center">

  <!-- 1) Leve X Pague Y -->
  <article style="width:160px;background:#fff;border:1px solid var(--border-1);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow-xs);position:relative">
    <span style="position:absolute;top:10px;left:10px;z-index:1;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 7px;border-radius:8px;background:var(--color-brand-500);color:#fff;font:600 9px/1.1 var(--font-sans);letter-spacing:.04em;text-align:center">
      <span style="font:700 11px/1 var(--font-sans)">LEVE 3</span><span style="opacity:.92">PAGUE 2</span>
    </span>
    <div style="aspect-ratio:4/5;background:var(--bg-subtle);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--color-ink-40)">
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9v9a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9"/><path d="M3 9 5 4h14l2 5"/><path d="M3 9h18"/></svg>
    </div>
    <div style="font:500 13px/1.25 var(--font-sans);color:var(--fg-1);text-wrap:pretty">Iogurte Grego Vigor</div>
    <div style="font:400 11px/1 var(--font-sans);color:var(--fg-3)">100g</div>
    <div style="display:flex;align-items:baseline;gap:5px;margin-top:auto">
      <span style="font:700 14px/1 var(--font-sans);font-variant-numeric:tabular-nums;color:var(--fg-1)">R$ 3,99</span>
      <span style="font:400 10px/1.1 var(--font-sans);color:var(--color-brand-700);margin-left:2px">3 por <b>R$ 7,98</b></span>
      <button style="margin-left:auto;width:28px;height:28px;border-radius:9999px;background:var(--color-brand-500);color:#fff;border:0;display:inline-flex;align-items:center;justify-content:center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
  </article>

  <!-- 2) Long product name (clamped to 3 lines) -->
  <article style="width:160px;background:#fff;border:1px solid var(--border-1);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow-xs);position:relative">
    <div style="aspect-ratio:4/5;background:var(--bg-subtle);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--color-ink-40)">
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9v9a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9"/><path d="M3 9 5 4h14l2 5"/><path d="M3 9h18"/></svg>
    </div>
    <div style="font:500 13px/1.25 var(--font-sans);color:var(--fg-1);text-wrap:pretty;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden">Detergente Líquido Ypê Clear Concentrado Maçã Verde</div>
    <div style="font:400 11px/1 var(--font-sans);color:var(--fg-3)">500ml · refil</div>
    <div style="display:flex;align-items:baseline;gap:5px;margin-top:auto">
      <span style="font:700 14px/1 var(--font-sans);font-variant-numeric:tabular-nums;color:var(--fg-1)">R$ 8,49</span>
      <button style="margin-left:auto;width:28px;height:28px;border-radius:9999px;background:var(--color-brand-500);color:#fff;border:0;display:inline-flex;align-items:center;justify-content:center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
  </article>

  <!-- 3) Time-limited deal (countdown) -->
  <article style="width:160px;background:#fff;border:1px solid var(--border-1);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow-xs);position:relative">
    <span style="position:absolute;top:10px;left:10px;z-index:1;display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:9999px;background:var(--color-brand-500);color:#fff;font:600 10px/1 var(--font-sans)">−25%</span>
    <span style="position:absolute;top:10px;right:10px;z-index:1;display:inline-flex;align-items:center;gap:3px;height:20px;padding:0 7px;border-radius:9999px;background:var(--bg-inverse);color:#fff;font:500 10px/1 var(--font-sans);font-variant-numeric:tabular-nums">
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      02h12
    </span>
    <div style="aspect-ratio:4/5;background:var(--bg-subtle);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--color-ink-40)">
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9v9a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9"/><path d="M3 9 5 4h14l2 5"/><path d="M3 9h18"/></svg>
    </div>
    <div style="font:500 13px/1.25 var(--font-sans);color:var(--fg-1);text-wrap:pretty">Picanha Bovina</div>
    <div style="font:400 11px/1 var(--font-sans);color:var(--fg-3)">kg</div>
    <div style="display:flex;align-items:baseline;gap:5px;margin-top:auto">
      <div style="display:flex;flex-direction:column">
        <span style="font:400 10px/1 var(--font-sans);color:var(--fg-3);text-decoration:line-through">R$ 89,90</span>
        <span style="font:700 14px/1 var(--font-sans);font-variant-numeric:tabular-nums;color:var(--color-brand-600)">R$ 67,40</span>
      </div>
      <button style="margin-left:auto;width:28px;height:28px;border-radius:9999px;background:var(--color-brand-500);color:#fff;border:0;display:inline-flex;align-items:center;justify-content:center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
  </article>

  <!-- 4) Out of stock (with substitution offer) -->
  <article style="width:160px;background:#fff;border:1px solid var(--border-1);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow-xs);position:relative;opacity:1">
    <span style="position:absolute;top:10px;left:10px;z-index:1;display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:9999px;background:var(--color-warning-bg);color:var(--color-warning-fg);border:1px solid var(--color-warning-border);font:500 10px/1 var(--font-sans)">Sem estoque</span>
    <div style="aspect-ratio:4/5;background:var(--bg-subtle);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--color-ink-40);filter:grayscale(1);opacity:.5">
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9v9a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9"/><path d="M3 9 5 4h14l2 5"/><path d="M3 9h18"/></svg>
    </div>
    <div style="font:500 13px/1.25 var(--font-sans);color:var(--fg-3);text-wrap:pretty">Leite Sem Lactose Piracanjuba</div>
    <div style="font:400 11px/1 var(--font-sans);color:var(--fg-4)">1L · indisponível</div>
    <button style="margin-top:auto;height:30px;background:var(--bg-subtle);color:var(--fg-1);border:0;border-radius:9999px;font:500 11px/1 var(--font-sans);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:4px">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><polyline points="21 3 21 8 16 8"/></svg>
      Ver similar
    </button>
  </article>

</body></html>
