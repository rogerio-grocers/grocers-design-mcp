<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="padding:18px 24px;display:flex;gap:14px;justify-content:center;align-items:stretch">
  <div style="flex:1;background:#fff;border:1px solid var(--border-1);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow-xs)">
    <span style="font:500 11px/1 var(--font-sans);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-brand)">Default</span>
    <span style="font:500 16px/1.2 var(--font-sans)">Faturamento da semana</span>
    <span style="font:500 30px/1 var(--font-sans);letter-spacing:-0.02em;font-variant-numeric:tabular-nums">R$ 184.302</span>
    <span style="font:500 12px/1 var(--font-sans);color:var(--color-success-fg)">+12,4% vs semana passada</span>
  </div>
  <div style="flex:1;background:var(--bg-inverse);color:#fff;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow-md)">
    <span style="font:500 11px/1 var(--font-sans);letter-spacing:.08em;text-transform:uppercase;color:var(--color-brand-400)">Inverse</span>
    <span style="font:500 16px/1.2 var(--font-sans);color:#fff">Pedidos hoje</span>
    <span style="font:500 30px/1 var(--font-sans);letter-spacing:-0.02em;font-variant-numeric:tabular-nums;color:#fff">412</span>
    <span style="font:500 12px/1 var(--font-sans);color:var(--color-ink-20)">203 entregues · 209 em rota</span>
  </div>
  <div style="flex:1;background:var(--color-brand-500);color:#fff;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow-md)">
    <span style="font:500 11px/1 var(--font-sans);letter-spacing:.08em;text-transform:uppercase;color:#fff;opacity:.9">IA</span>
    <span style="font:500 16px/1.2 var(--font-sans)">Carrinho automático</span>
    <span style="font:400 13px/1.4 var(--font-sans);opacity:.92">8 itens sugeridos com base no histórico do cliente.</span>
  </div>
</body></html>
