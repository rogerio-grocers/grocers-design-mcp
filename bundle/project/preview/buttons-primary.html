<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="padding:22px 24px;display:flex;flex-direction:column;gap:14px;justify-content:center">
  <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
    <button style="display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px;background:var(--color-brand-500);color:#fff;font:500 15px/1 var(--font-sans);border:0;border-radius:10px;cursor:pointer;box-shadow:var(--shadow-xs)">Agende uma reunião</button>
    <button style="display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px;background:var(--color-brand-600);color:#fff;font:500 15px/1 var(--font-sans);border:0;border-radius:10px;cursor:pointer;box-shadow:var(--shadow-sm)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg><span>Adicionar</span></button>
    <button disabled style="display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px;background:var(--bg-subtle);color:var(--fg-4);font:500 15px/1 var(--font-sans);border:0;border-radius:10px;cursor:not-allowed">Indisponível</button>
    <button style="display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px;background:var(--color-brand-500);color:#fff;font:500 15px/1 var(--font-sans);border:0;border-radius:10px;cursor:pointer;box-shadow:var(--shadow-focus)">Foco</button>
  </div>
  <div style="display:flex;gap:18px;font:500 11px/1 var(--font-sans);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)">
    <span>default</span><span>hover</span><span>disabled</span><span>focus ring</span>
  </div>
</body></html>
