<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="padding:18px 24px;display:flex;gap:20px;justify-content:center;align-items:center">
  <div style="flex:0 0 auto;display:flex;align-items:flex-end;gap:0;padding:20px 28px;background:var(--bg-inverse);border-radius:14px">
    <span style="font:600 64px/1 var(--font-sans);letter-spacing:-0.02em;color:#fff">Grocers</span>
    <span style="width:14px;height:14px;border-radius:50%;background:var(--color-brand-500);margin-left:2px;margin-bottom:8px"></span>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;gap:10px;font:400 13px/1.5 var(--font-sans);color:var(--fg-2);max-width:280px">
    <span style="font:600 12px/1 var(--font-sans);color:var(--fg-1);text-transform:uppercase;letter-spacing:.08em">The red dot</span>
    <span>The mark's signature. Use as a standalone bullet in marketing surfaces, after the wordmark, or as a hover/active dot in product navigation.</span>
    <span style="font:400 12px/1 var(--font-mono);color:var(--fg-3)">--color-brand-500 · 14px · pill</span>
  </div>
</body></html>
