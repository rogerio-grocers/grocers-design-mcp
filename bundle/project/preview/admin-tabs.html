<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="padding:18px 0 0;display:flex;flex-direction:column;gap:0;background:var(--bg-canvas)">

  <!-- Row 1 — primary tabs over status filter -->
  <div style="display:flex;align-items:center;padding:0 24px;background:var(--bg-surface);border-bottom:1px solid var(--border-1);position:relative">
    <button style="display:inline-flex;align-items:center;gap:7px;height:44px;padding:0 14px;background:transparent;border:0;border-bottom:2px solid var(--color-ink);margin-bottom:-1px;font:500 13px/1 var(--font-sans);color:var(--fg-1);cursor:pointer">
    
    Todos
    <span style="display:inline-flex;align-items:center;height:18px;padding:0 7px;border-radius:9999px;background:var(--bg-inverse);color:#fff;font:500 10px/1 var(--font-sans);font-variant-numeric:tabular-nums;letter-spacing:.02em">247</span>
  </button>
    <button style="display:inline-flex;align-items:center;gap:7px;height:44px;padding:0 14px;background:transparent;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;font:400 13px/1 var(--font-sans);color:var(--fg-2);cursor:pointer">
    <span style="width:7px;height:7px;border-radius:50%;background:var(--color-info-fg)"></span>
    Novos
    <span style="display:inline-flex;align-items:center;height:18px;padding:0 7px;border-radius:9999px;background:var(--bg-subtle);color:var(--fg-2);font:500 10px/1 var(--font-sans);font-variant-numeric:tabular-nums;letter-spacing:.02em">12</span>
  </button>
    <button style="display:inline-flex;align-items:center;gap:7px;height:44px;padding:0 14px;background:transparent;border:0;border-bottom:2px solid var(--border-2);margin-bottom:-1px;font:400 13px/1 var(--font-sans);color:var(--fg-2);cursor:pointer">
    <span style="width:7px;height:7px;border-radius:50%;background:var(--color-info-fg)"></span>
    Em separação
    <span style="display:inline-flex;align-items:center;height:18px;padding:0 7px;border-radius:9999px;background:var(--bg-subtle);color:var(--fg-2);font:500 10px/1 var(--font-sans);font-variant-numeric:tabular-nums;letter-spacing:.02em">38</span>
  </button>
    <button style="display:inline-flex;align-items:center;gap:7px;height:44px;padding:0 14px;background:transparent;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;font:400 13px/1 var(--font-sans);color:var(--fg-2);cursor:pointer">
    <span style="width:7px;height:7px;border-radius:50%;background:var(--color-warning-fg)"></span>
    Em rota
    <span style="display:inline-flex;align-items:center;height:18px;padding:0 7px;border-radius:9999px;background:var(--bg-subtle);color:var(--fg-2);font:500 10px/1 var(--font-sans);font-variant-numeric:tabular-nums;letter-spacing:.02em">47</span>
  </button>
    <button style="display:inline-flex;align-items:center;gap:7px;height:44px;padding:0 14px;background:transparent;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;font:400 13px/1 var(--font-sans);color:var(--fg-2);cursor:pointer">
    <span style="width:7px;height:7px;border-radius:50%;background:var(--color-success-fg)"></span>
    Entregues
    <span style="display:inline-flex;align-items:center;height:18px;padding:0 7px;border-radius:9999px;background:var(--bg-subtle);color:var(--fg-2);font:500 10px/1 var(--font-sans);font-variant-numeric:tabular-nums;letter-spacing:.02em">142</span>
  </button>
    <button style="display:inline-flex;align-items:center;gap:7px;height:44px;padding:0 14px;background:transparent;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;font:400 13px/1 var(--font-sans);color:var(--fg-2);cursor:pointer">
    <span style="width:7px;height:7px;border-radius:50%;background:var(--color-danger-fg)"></span>
    Cancelados
    <span style="display:inline-flex;align-items:center;height:18px;padding:0 7px;border-radius:9999px;background:var(--bg-subtle);color:var(--fg-2);font:500 10px/1 var(--font-sans);font-variant-numeric:tabular-nums;letter-spacing:.02em">8</span>
  </button>
    <div style="flex:1"></div>
    <button style="display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;background:transparent;border:0;color:var(--fg-3);font:500 12px/1 var(--font-sans);cursor:pointer">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M6 12h12M10 18h4"/></svg>Ordenar: Mais recentes <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </button>
  </div>

  <!-- Row 2 — filter toolbar: search + segmented period + filter button + applied chips -->
  <div style="display:flex;align-items:center;gap:10px;padding:14px 24px;background:var(--bg-surface);border-bottom:1px solid var(--border-1);flex-wrap:wrap">

    <!-- Search -->
    <div style="display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;background:#fff;border:1px solid var(--border-2);border-radius:9999px;color:var(--fg-3);width:240px">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <span style="font:400 13px/1 var(--font-sans);color:var(--fg-3)">Pedido, cliente, CPF…</span>
    </div>

    <!-- Segmented period control -->
    <div style="display:inline-flex;align-items:center;padding:3px;background:var(--bg-subtle);border-radius:10px;height:34px">
      <button style="height:28px;padding:0 12px;border-radius:7px;background:transparent;color:var(--fg-2);border:0;font:400 12px/1 var(--font-sans);cursor:pointer;box-shadow:none">Hoje</button><button style="height:28px;padding:0 12px;border-radius:7px;background:#fff;color:var(--fg-1);border:0;font:500 12px/1 var(--font-sans);cursor:pointer;box-shadow:var(--shadow-xs)">7 dias</button><button style="height:28px;padding:0 12px;border-radius:7px;background:transparent;color:var(--fg-2);border:0;font:400 12px/1 var(--font-sans);cursor:pointer;box-shadow:none">30 dias</button><button style="height:28px;padding:0 12px;border-radius:7px;background:transparent;color:var(--fg-2);border:0;font:400 12px/1 var(--font-sans);cursor:pointer;box-shadow:none">Mês</button>
      <span style="width:1px;height:18px;background:var(--border-2);margin:0 3px"></span>
      <button style="display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:7px;background:transparent;color:var(--fg-2);border:0;font:400 12px/1 var(--font-sans);cursor:pointer">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg> 15 mai – 21 mai
      </button>
    </div>

    <!-- Filter dropdown -->
    <button style="display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;background:#fff;border:1px solid var(--border-2);border-radius:10px;color:var(--fg-1);font:500 13px/1 var(--font-sans);cursor:pointer">
      Loja: Todas <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <button style="display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;background:#fff;border:1px solid var(--border-2);border-radius:10px;color:var(--fg-1);font:500 13px/1 var(--font-sans);cursor:pointer">
      Pagamento: Pago <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </button>

    <div style="flex:1"></div>

    <!-- Right side: result count + clear -->
    <span style="font:400 12px/1 var(--font-sans);color:var(--fg-3)"><b style="color:var(--fg-1);font-variant-numeric:tabular-nums">42</b> resultados</span>
  </div>

  <!-- Row 3 — applied filter chips (removable) -->
  <div style="display:flex;align-items:center;gap:8px;padding:12px 24px;flex-wrap:wrap">
    <span style="font:500 11px/1 var(--font-sans);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)">Filtros aplicados</span>
    <span style="display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 5px 0 11px;border-radius:9999px;background:#fff;border:1px solid var(--border-2);color:var(--fg-1);font:500 12px/1 var(--font-sans);letter-spacing:.015em">Vila Madalena<button style="width:18px;height:18px;border-radius:9999px;background:var(--bg-subtle);border:0;color:var(--fg-2);display:inline-flex;align-items:center;justify-content:center;cursor:pointer"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></span><span style="display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 5px 0 11px;border-radius:9999px;background:#fff;border:1px solid var(--border-2);color:var(--fg-1);font:500 12px/1 var(--font-sans);letter-spacing:.015em">Pagamento: Pago<button style="width:18px;height:18px;border-radius:9999px;background:var(--bg-subtle);border:0;color:var(--fg-2);display:inline-flex;align-items:center;justify-content:center;cursor:pointer"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></span><span style="display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 5px 0 11px;border-radius:9999px;background:#fff;border:1px solid var(--border-2);color:var(--fg-1);font:500 12px/1 var(--font-sans);letter-spacing:.015em">Ticket > R$ 150<button style="width:18px;height:18px;border-radius:9999px;background:var(--bg-subtle);border:0;color:var(--fg-2);display:inline-flex;align-items:center;justify-content:center;cursor:pointer"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></span>
    <button style="height:26px;padding:0 10px;background:transparent;border:0;color:var(--fg-brand);font:500 12px/1 var(--font-sans);cursor:pointer">Limpar tudo</button>
  </div>

</body></html>
