<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="padding:20px 24px;display:flex;flex-direction:column;gap:12px;justify-content:center">
  <div style="display:flex;gap:18px;align-items:flex-end">
    
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
        <div style="width:56px;height:56px;background:var(--color-brand-100);border:1px solid var(--color-brand-200);border-radius:4px"></div>
        <span style="font:600 11px/1 var(--font-sans);color:var(--fg-1)">xs</span>
        <span style="font:400 10px/1 var(--font-mono);color:var(--fg-3)">4px</span>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
        <div style="width:56px;height:56px;background:var(--color-brand-100);border:1px solid var(--color-brand-200);border-radius:6px"></div>
        <span style="font:600 11px/1 var(--font-sans);color:var(--fg-1)">sm</span>
        <span style="font:400 10px/1 var(--font-mono);color:var(--fg-3)">6px</span>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
        <div style="width:56px;height:56px;background:var(--color-brand-100);border:1px solid var(--color-brand-200);border-radius:10px"></div>
        <span style="font:600 11px/1 var(--font-sans);color:var(--fg-1)">md</span>
        <span style="font:400 10px/1 var(--font-mono);color:var(--fg-3)">10px</span>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
        <div style="width:56px;height:56px;background:var(--color-brand-100);border:1px solid var(--color-brand-200);border-radius:14px"></div>
        <span style="font:600 11px/1 var(--font-sans);color:var(--fg-1)">lg</span>
        <span style="font:400 10px/1 var(--font-mono);color:var(--fg-3)">14px</span>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
        <div style="width:56px;height:56px;background:var(--color-brand-100);border:1px solid var(--color-brand-200);border-radius:18px"></div>
        <span style="font:600 11px/1 var(--font-sans);color:var(--fg-1)">xl</span>
        <span style="font:400 10px/1 var(--font-mono);color:var(--fg-3)">18px</span>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
        <div style="width:56px;height:56px;background:var(--color-brand-100);border:1px solid var(--color-brand-200);border-radius:24px"></div>
        <span style="font:600 11px/1 var(--font-sans);color:var(--fg-1)">2xl</span>
        <span style="font:400 10px/1 var(--font-mono);color:var(--fg-3)">24px</span>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
        <div style="width:56px;height:56px;background:var(--color-brand-100);border:1px solid var(--color-brand-200);border-radius:9999px"></div>
        <span style="font:600 11px/1 var(--font-sans);color:var(--fg-1)">pill</span>
        <span style="font:400 10px/1 var(--font-mono);color:var(--fg-3)">999px</span>
      </div>
  </div>
</body></html>
