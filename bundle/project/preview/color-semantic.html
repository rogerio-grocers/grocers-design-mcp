<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="padding:18px 24px;display:flex;flex-direction:column;gap:8px;justify-content:center">
  
    <div style="display:flex;align-items:center;gap:12px">
      <div style="flex:0 0 220px;display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--color-success-bg);color:var(--color-success-fg);border:1px solid var(--color-success-border);border-radius:10px;font:500 13px/1 var(--font-sans)">
        <span style="width:8px;height:8px;border-radius:50%;background:var(--color-success-fg)"></span>Pedido confirmado
      </div>
      <span style="font:500 11px/1 var(--font-sans);color:var(--fg-2);text-transform:uppercase;letter-spacing:.08em">success</span>
      <span style="font:400 11px/1 var(--font-mono);color:var(--fg-3);margin-left:auto">success</span>
    </div>
    <div style="display:flex;align-items:center;gap:12px">
      <div style="flex:0 0 220px;display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--color-warning-bg);color:var(--color-warning-fg);border:1px solid var(--color-warning-border);border-radius:10px;font:500 13px/1 var(--font-sans)">
        <span style="width:8px;height:8px;border-radius:50%;background:var(--color-warning-fg)"></span>Estoque baixo
      </div>
      <span style="font:500 11px/1 var(--font-sans);color:var(--fg-2);text-transform:uppercase;letter-spacing:.08em">warning</span>
      <span style="font:400 11px/1 var(--font-mono);color:var(--fg-3);margin-left:auto">warning</span>
    </div>
    <div style="display:flex;align-items:center;gap:12px">
      <div style="flex:0 0 220px;display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--color-danger-bg);color:var(--color-danger-fg);border:1px solid var(--color-danger-border);border-radius:10px;font:500 13px/1 var(--font-sans)">
        <span style="width:8px;height:8px;border-radius:50%;background:var(--color-danger-fg)"></span>Pagamento recusado
      </div>
      <span style="font:500 11px/1 var(--font-sans);color:var(--fg-2);text-transform:uppercase;letter-spacing:.08em">danger</span>
      <span style="font:400 11px/1 var(--font-mono);color:var(--fg-3);margin-left:auto">amber (not brand red)</span>
    </div>
    <div style="display:flex;align-items:center;gap:12px">
      <div style="flex:0 0 220px;display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--color-info-bg);color:var(--color-info-fg);border:1px solid var(--color-info-border);border-radius:10px;font:500 13px/1 var(--font-sans)">
        <span style="width:8px;height:8px;border-radius:50%;background:var(--color-info-fg)"></span>5 itens substituídos
      </div>
      <span style="font:500 11px/1 var(--font-sans);color:var(--fg-2);text-transform:uppercase;letter-spacing:.08em">info</span>
      <span style="font:400 11px/1 var(--font-mono);color:var(--fg-3);margin-left:auto">info</span>
    </div>
</body></html>
