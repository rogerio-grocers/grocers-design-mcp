<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="padding:0;display:flex;flex-direction:column;background:var(--bg-canvas)">
  <header style="display:flex;align-items:center;gap:16px;height:60px;padding:0 24px;background:var(--bg-surface);border-bottom:1px solid var(--border-1)">
    <div style="display:flex;align-items:center;gap:8px;font:400 13px/1 var(--font-sans);color:var(--fg-3)">
      <span>Pedidos</span>
      <span style="color:var(--fg-4)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span>
      <span style="color:var(--fg-1);font-weight:500">#GRC-48201</span>
    </div>
    <div style="flex:1"></div>
    <div style="display:inline-flex;align-items:center;gap:8px;height:36px;width:240px;padding:0 12px;background:var(--bg-subtle);border-radius:9999px;color:var(--fg-3)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><span style="font:400 13px/1 var(--font-sans)">Buscar (⌘ K)</span>
    </div>
    <button style="width:36px;height:36px;border-radius:9999px;background:transparent;border:0;color:var(--fg-2);position:relative;cursor:pointer;display:inline-flex;align-items:center;justify-content:center">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      <span style="position:absolute;top:4px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--color-brand-500);border:2px solid var(--bg-surface)"></span>
    </button>
    <div style="height:24px;width:1px;background:var(--border-1)"></div>
    <div style="display:flex;align-items:center;gap:10px">
      <div style="width:32px;height:32px;border-radius:9999px;background:var(--bg-inverse);color:#fff;display:inline-flex;align-items:center;justify-content:center;font:500 12px/1 var(--font-sans)">VP</div>
      <div style="display:flex;flex-direction:column;line-height:1.1">
        <span style="font:500 13px/1.2 var(--font-sans);color:var(--fg-1)">Vitor Pereira</span>
        <span style="font:400 11px/1.2 var(--font-sans);color:var(--fg-3)">Zona Sul · Admin</span>
      </div>
    </div>
  </header>
  <div style="padding:14px 24px;color:var(--fg-3);font:500 12px/1.4 var(--font-sans)">
    <div style="font:600 12px/1 var(--font-sans);color:var(--fg-1);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px">Top bar</div>
    Breadcrumbs · global search (⌘K) · notifications (red dot for unread) · org-scoped user pill
  </div>
</body></html>
