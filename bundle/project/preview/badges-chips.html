<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="padding:20px 24px;display:flex;flex-direction:column;gap:14px;justify-content:center">
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <span style="display:inline-flex;align-items:center;height:24px;padding:0 11px;border-radius:9999px;background:var(--color-success-bg);color:var(--color-success-fg);font:500 12px/1 var(--font-sans);letter-spacing:.015em;gap:4px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>Em estoque</span>
    <span style="display:inline-flex;align-items:center;height:24px;padding:0 11px;border-radius:9999px;background:var(--color-brand-500);color:#fff;font:600 12px/1 var(--font-sans);letter-spacing:.02em">−30%</span>
    <span style="display:inline-flex;align-items:center;height:24px;padding:0 11px;border-radius:9999px;background:var(--color-brand-50);color:var(--color-brand-700);font:500 12px/1 var(--font-sans);letter-spacing:.015em;border:1px solid var(--color-brand-100)">Oferta</span>
    <span style="display:inline-flex;align-items:center;height:24px;padding:0 11px;border-radius:9999px;background:var(--color-info-bg);color:var(--color-info-fg);font:500 12px/1 var(--font-sans);letter-spacing:.015em">Novo</span>
    <span style="display:inline-flex;align-items:center;height:24px;padding:0 11px;border-radius:9999px;background:var(--color-warning-bg);color:var(--color-warning-fg);font:500 12px/1 var(--font-sans);letter-spacing:.015em">Últimas unidades</span>
    <span style="display:inline-flex;align-items:center;height:24px;padding:0 11px;border-radius:9999px;background:var(--bg-inverse);color:#fff;font:500 12px/1 var(--font-sans);letter-spacing:.015em">Frescos</span>
  </div>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <button style="height:34px;padding:0 14px;border-radius:9999px;background:#fff;color:var(--fg-1);border:1px solid var(--border-2);font:500 13px/1 var(--font-sans);cursor:pointer">Todos</button>
    <button style="height:34px;padding:0 14px;border-radius:9999px;background:var(--bg-inverse);color:#fff;border:0;font:500 13px/1 var(--font-sans);cursor:pointer">Hortifruti</button>
    <button style="height:34px;padding:0 14px;border-radius:9999px;background:#fff;color:var(--fg-1);border:1px solid var(--border-2);font:500 13px/1 var(--font-sans);cursor:pointer">Padaria</button>
    <button style="height:34px;padding:0 14px;border-radius:9999px;background:#fff;color:var(--fg-1);border:1px solid var(--border-2);font:500 13px/1 var(--font-sans);cursor:pointer">Bebidas</button>
    <button style="height:34px;padding:0 14px;border-radius:9999px;background:#fff;color:var(--fg-1);border:1px solid var(--border-2);font:500 13px/1 var(--font-sans);cursor:pointer">Limpeza</button>
    <button style="height:34px;padding:0 14px;border-radius:9999px;background:#fff;color:var(--fg-1);border:1px solid var(--border-2);font:500 13px/1 var(--font-sans);cursor:pointer">Higiene</button>
  </div>
</body></html>
