<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="padding:20px 24px;display:flex;flex-direction:column;gap:10px;justify-content:center">
  
    <div style="display:flex;gap:12px;padding:12px 14px;background:var(--color-success-bg);border:1px solid var(--color-success-border);border-radius:12px;align-items:flex-start;max-width:520px">
      <span style="color:var(--color-success-fg);flex:0 0 18px;margin-top:1px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
      <div style="flex:1">
        <div style="font:500 13px/1.3 var(--font-sans);color:var(--color-success-fg)">Pedido confirmado</div>
        <div style="font:400 12px/1.4 var(--font-sans);color:var(--color-success-fg);opacity:.85;margin-top:2px">#GRC-48202 enviado para separação.</div>
      </div>
      <button style="background:transparent;border:0;color:var(--color-success-fg);opacity:.6;cursor:pointer;padding:0"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div style="display:flex;gap:12px;padding:12px 14px;background:var(--color-info-bg);border:1px solid var(--color-info-border);border-radius:12px;align-items:flex-start;max-width:520px">
      <span style="color:var(--color-info-fg);flex:0 0 18px;margin-top:1px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg></span>
      <div style="flex:1">
        <div style="font:500 13px/1.3 var(--font-sans);color:var(--color-info-fg)">5 itens substituídos</div>
        <div style="font:400 12px/1.4 var(--font-sans);color:var(--color-info-fg);opacity:.85;margin-top:2px">A IA sugeriu substitutos com base no estoque atual.</div>
      </div>
      <button style="background:transparent;border:0;color:var(--color-info-fg);opacity:.6;cursor:pointer;padding:0"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div style="display:flex;gap:12px;padding:12px 14px;background:var(--color-warning-bg);border:1px solid var(--color-warning-border);border-radius:12px;align-items:flex-start;max-width:520px">
      <span style="color:var(--color-warning-fg);flex:0 0 18px;margin-top:1px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg></span>
      <div style="flex:1">
        <div style="font:500 13px/1.3 var(--font-sans);color:var(--color-warning-fg)">Estoque crítico em 3 SKUs</div>
        <div style="font:400 12px/1.4 var(--font-sans);color:var(--color-warning-fg);opacity:.85;margin-top:2px">Leite Italac · Iogurte Vigor · Pão Integral.</div>
      </div>
      <button style="background:transparent;border:0;color:var(--color-warning-fg);opacity:.6;cursor:pointer;padding:0"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
</body></html>
