<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>

      <div style="display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end;height:100%">

    <span style="font:600 13px/1 var(--font-sans);color:var(--fg-1)">Spacing · 4px scale</span>
    <span style="font:400 12px/1 var(--font-mono);color:var(--fg-3)">--space-1 … --space-20</span>
