<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="padding:20px 24px;display:flex;flex-direction:column;gap:10px;justify-content:center">
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">
    
      <div style="display:flex;flex-direction:column;gap:6px">
        <div style="height:60px;border-radius:10px;background:var(--bg-canvas);border:1px solid rgba(0,0,0,.06)"></div>
        <div style="font:600 12px/1 var(--font-sans);color:var(--fg-1)">bg-canvas</div>
        <div style="font:400 11px/1.3 var(--font-mono);color:var(--fg-3)">--bg-canvas</div>
        <div style="font:400 11px/1.3 var(--font-sans);color:var(--fg-3)">app background</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <div style="height:60px;border-radius:10px;background:var(--bg-surface);border:1px solid rgba(0,0,0,.06)"></div>
        <div style="font:600 12px/1 var(--font-sans);color:var(--fg-1)">bg-surface</div>
        <div style="font:400 11px/1.3 var(--font-mono);color:var(--fg-3)">--bg-surface</div>
        <div style="font:400 11px/1.3 var(--font-sans);color:var(--fg-3)">cards / sheets</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <div style="height:60px;border-radius:10px;background:var(--bg-subtle);border:1px solid rgba(0,0,0,.06)"></div>
        <div style="font:600 12px/1 var(--font-sans);color:var(--fg-1)">bg-subtle</div>
        <div style="font:400 11px/1.3 var(--font-mono);color:var(--fg-3)">--bg-subtle</div>
        <div style="font:400 11px/1.3 var(--font-sans);color:var(--fg-3)">hover / chips</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <div style="height:60px;border-radius:10px;background:var(--bg-inverse);border:1px solid rgba(0,0,0,.06)"></div>
        <div style="font:600 12px/1 var(--font-sans);color:var(--fg-1)">bg-inverse</div>
        <div style="font:400 11px/1.3 var(--font-mono);color:var(--fg-3)">--bg-inverse</div>
        <div style="font:400 11px/1.3 var(--font-sans);color:var(--fg-3)">dark surface</div>
      </div>
  </div>
</body></html>
