<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="padding:20px 24px;display:flex;flex-direction:column;gap:14px;justify-content:center">
  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <div style="display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;background:#fff;border:1px solid var(--border-2);border-radius:10px;color:var(--fg-1);font:500 13px/1 var(--font-sans)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span>15 mai – 21 mai, 2026</span></div>
    <button style="display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;background:#fff;border:1px solid var(--border-2);border-radius:10px;color:var(--fg-1);font:500 13px/1 var(--font-sans);cursor:pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 3H2l8 9.46V19l4 2v-8.54Z"/></svg>Filtros <span style="display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:9999px;background:var(--color-brand-500);color:#fff;font:500 10px/1 var(--font-sans)">3</span></button>
    <div style="flex:1"></div>
    <button style="height:36px;padding:0 14px;background:var(--bg-inverse);color:#fff;border:0;border-radius:10px;font:500 13px/1 var(--font-sans);cursor:pointer">Exportar CSV</button>
  </div>
  <div style="display:flex;align-items:center;justify-content:space-between">
    <span style="font:400 12px/1 var(--font-sans);color:var(--fg-3)">Mostrando <b style="color:var(--fg-1);font-variant-numeric:tabular-nums">1–25</b> de <b style="color:var(--fg-1);font-variant-numeric:tabular-nums">247</b> pedidos</span>
    <div style="display:inline-flex;align-items:center;gap:4px">
      <button style="width:32px;height:32px;border-radius:8px;background:transparent;color:var(--fg-1);border:1px solid var(--border-1);font:500 13px/1 var(--font-sans);font-variant-numeric:tabular-nums;cursor:pointer">‹</button><button style="width:32px;height:32px;border-radius:8px;background:transparent;color:var(--fg-1);border:1px solid var(--border-1);font:500 13px/1 var(--font-sans);font-variant-numeric:tabular-nums;cursor:pointer">1</button><button style="width:32px;height:32px;border-radius:8px;background:var(--bg-inverse);color:#fff;border:0;font:500 13px/1 var(--font-sans);font-variant-numeric:tabular-nums;cursor:pointer">2</button><button style="width:32px;height:32px;border-radius:8px;background:transparent;color:var(--fg-1);border:1px solid var(--border-1);font:500 13px/1 var(--font-sans);font-variant-numeric:tabular-nums;cursor:pointer">3</button><span style="width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;color:var(--fg-4);font:500 13px/1 var(--font-sans)">…</span><button style="width:32px;height:32px;border-radius:8px;background:transparent;color:var(--fg-1);border:1px solid var(--border-1);font:500 13px/1 var(--font-sans);font-variant-numeric:tabular-nums;cursor:pointer">10</button><button style="width:32px;height:32px;border-radius:8px;background:transparent;color:var(--fg-1);border:1px solid var(--border-1);font:500 13px/1 var(--font-sans);font-variant-numeric:tabular-nums;cursor:pointer">›</button>
    </div>
  </div>
</body></html>
