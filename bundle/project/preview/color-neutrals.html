<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="padding:20px 24px;display:flex;flex-direction:column;gap:10px;justify-content:center">
  <div style="display:grid;grid-template-columns:repeat(10,1fr);gap:6px">
    <div style="display:flex;flex-direction:column;gap:6px">
      <div style="height:48px;border-radius:10px;background:var(--color-gray-0);border:1px solid rgba(0,0,0,.08)"></div>
      <div style="font:500 10px/1 var(--font-sans);color:var(--fg-3);text-align:center">0</div>
    </div><div style="display:flex;flex-direction:column;gap:6px">
      <div style="height:48px;border-radius:10px;background:var(--color-gray-25);border:1px solid rgba(0,0,0,.08)"></div>
      <div style="font:500 10px/1 var(--font-sans);color:var(--fg-3);text-align:center">25</div>
    </div><div style="display:flex;flex-direction:column;gap:6px">
      <div style="height:48px;border-radius:10px;background:var(--color-gray-50);border:1px solid rgba(0,0,0,.08)"></div>
      <div style="font:500 10px/1 var(--font-sans);color:var(--fg-3);text-align:center">50</div>
    </div><div style="display:flex;flex-direction:column;gap:6px">
      <div style="height:48px;border-radius:10px;background:var(--color-gray-100);border:1px solid rgba(0,0,0,.08)"></div>
      <div style="font:500 10px/1 var(--font-sans);color:var(--fg-3);text-align:center">100</div>
    </div><div style="display:flex;flex-direction:column;gap:6px">
      <div style="height:48px;border-radius:10px;background:var(--color-gray-200);"></div>
      <div style="font:500 10px/1 var(--font-sans);color:var(--fg-3);text-align:center">200</div>
    </div><div style="display:flex;flex-direction:column;gap:6px">
      <div style="height:48px;border-radius:10px;background:var(--color-gray-300);"></div>
      <div style="font:500 10px/1 var(--font-sans);color:var(--fg-3);text-align:center">300</div>
    </div><div style="display:flex;flex-direction:column;gap:6px">
      <div style="height:48px;border-radius:10px;background:var(--color-gray-400);"></div>
      <div style="font:500 10px/1 var(--font-sans);color:var(--fg-3);text-align:center">400</div>
    </div><div style="display:flex;flex-direction:column;gap:6px">
      <div style="height:48px;border-radius:10px;background:var(--color-gray-500);"></div>
      <div style="font:500 10px/1 var(--font-sans);color:var(--fg-3);text-align:center">500</div>
    </div><div style="display:flex;flex-direction:column;gap:6px">
      <div style="height:48px;border-radius:10px;background:var(--color-gray-600);"></div>
      <div style="font:500 10px/1 var(--font-sans);color:var(--fg-3);text-align:center">600</div>
    </div><div style="display:flex;flex-direction:column;gap:6px">
      <div style="height:48px;border-radius:10px;background:var(--color-gray-700);"></div>
      <div style="font:500 10px/1 var(--font-sans);color:var(--fg-3);text-align:center">700</div>
    </div>
  </div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px">
    <span style="font:600 13px/1 var(--font-sans);color:var(--fg-1)">Neutrals • cool gray (faint plum)</span>
    <span style="font:400 12px/1 var(--font-mono);color:var(--fg-3)">--color-gray-*</span>
  </div>
</body></html>
