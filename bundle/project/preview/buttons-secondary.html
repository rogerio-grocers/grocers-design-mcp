<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="padding:22px 24px;display:flex;flex-direction:column;gap:14px;justify-content:center">
  <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
    <button style="display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px;background:var(--bg-inverse);color:#fff;font:500 15px/1 var(--font-sans);border:0;border-radius:10px;cursor:pointer">Saiba mais</button>
    <button style="display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px;background:#fff;color:var(--fg-1);font:500 15px/1 var(--font-sans);border:1px solid var(--border-2);border-radius:10px;cursor:pointer">Cancelar</button>
    <button style="display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 14px;background:transparent;color:var(--fg-brand);font:500 15px/1 var(--font-sans);border:0;border-radius:10px;cursor:pointer">Ver detalhes <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
    <button style="display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;background:#fff;color:var(--fg-2);border:1px solid var(--border-1);border-radius:10px;cursor:pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg></button>
    <div style="display:inline-flex;align-items:center;height:36px;border:1px solid var(--border-2);border-radius:9999px;overflow:hidden;background:#fff">
      <button style="width:36px;height:36px;background:transparent;border:0;color:var(--fg-1);cursor:pointer;display:inline-flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg></button>
      <span style="min-width:28px;text-align:center;font:500 14px/1 var(--font-sans);font-variant-numeric:tabular-nums">2</span>
      <button style="width:36px;height:36px;background:transparent;border:0;color:var(--fg-1);cursor:pointer;display:inline-flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
  </div>
  <div style="display:flex;gap:18px;font:500 11px/1 var(--font-sans);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)">
    <span>inverse</span><span>secondary</span><span>tertiary</span><span>icon</span><span>stepper</span>
  </div>
</body></html>
