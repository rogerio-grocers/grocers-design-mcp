<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="padding:20px 24px;display:flex;flex-direction:column;gap:12px;justify-content:center">
  <div style="display:flex;gap:12px;align-items:center">
    <div style="flex:1.4;display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 14px;background:#fff;border:1px solid var(--border-2);border-radius:10px;color:var(--fg-3)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input placeholder="Buscar em mais de 12.000 produtos" style="flex:1;border:0;outline:0;font:400 15px/1 var(--font-sans);color:var(--fg-1);background:transparent"></div>
    <input value="vitor@zonasul.com" style="flex:1;height:44px;padding:0 14px;background:#fff;border:1px solid var(--border-2);border-radius:10px;font:400 15px/1 var(--font-sans);color:var(--fg-1);outline:0">
    <input value="Em foco" style="flex:1;height:44px;padding:0 14px;background:#fff;border:1.5px solid var(--color-ink);box-shadow:var(--shadow-focus);border-radius:10px;font:400 15px/1 var(--font-sans);color:var(--fg-1);outline:0">
  </div>
  <div style="display:flex;gap:12px;align-items:flex-end">
    <div style="flex:1;display:flex;flex-direction:column;gap:4px">
      <span style="display:inline-flex;align-items:center;gap:6px;font:500 12px/1 var(--font-sans);color:var(--color-danger-fg)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>CPF inválido</span>
      <input value="000.000.000-00" style="height:40px;padding:0 12px;background:var(--color-danger-bg);border:1px solid var(--color-danger-border);border-radius:10px;font:400 14px/1 var(--font-sans);color:var(--color-danger-fg);outline:0">
    </div>
    <select style="flex:1;height:40px;padding:0 12px;background:#fff;border:1px solid var(--border-2);border-radius:10px;font:400 14px/1 var(--font-sans);color:var(--fg-1)"><option>Bairro · Vila Madalena</option></select>
    <label style="flex:1;display:inline-flex;align-items:center;gap:10px;font:500 14px/1 var(--font-sans);color:var(--fg-1);height:40px"><span style="width:20px;height:20px;border-radius:6px;background:var(--color-ink);color:#fff;display:inline-flex;align-items:center;justify-content:center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>Receber por WhatsApp</label>
  </div>
</body></html>
