<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="padding:20px 24px;display:flex;flex-direction:column;gap:14px;justify-content:center">
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <span style="display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 11px;border-radius:9999px;background:var(--color-info-bg);color:var(--color-info-fg);border:1px solid var(--color-info-border);font:500 12px/1 var(--font-sans);letter-spacing:.015em"><span style="width:6px;height:6px;border-radius:50%;background:var(--color-info-fg)"></span>Novo</span><span style="display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 11px;border-radius:9999px;background:var(--color-info-bg);color:var(--color-info-fg);border:1px solid var(--color-info-border);font:500 12px/1 var(--font-sans);letter-spacing:.015em"><span style="width:6px;height:6px;border-radius:50%;background:var(--color-info-fg)"></span>Em separação</span><span style="display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 11px;border-radius:9999px;background:var(--color-warning-bg);color:var(--color-warning-fg);border:1px solid var(--color-warning-border);font:500 12px/1 var(--font-sans);letter-spacing:.015em"><span style="width:6px;height:6px;border-radius:50%;background:var(--color-warning-fg)"></span>Em rota</span><span style="display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 11px;border-radius:9999px;background:var(--color-success-bg);color:var(--color-success-fg);border:1px solid var(--color-success-border);font:500 12px/1 var(--font-sans);letter-spacing:.015em"><span style="width:6px;height:6px;border-radius:50%;background:var(--color-success-fg)"></span>Entregue</span><span style="display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 11px;border-radius:9999px;background:var(--color-danger-bg);color:var(--color-danger-fg);border:1px solid var(--color-danger-border);font:500 12px/1 var(--font-sans);letter-spacing:.015em"><span style="width:6px;height:6px;border-radius:50%;background:var(--color-danger-fg)"></span>Cancelado</span><span style="display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 11px;border-radius:9999px;background:var(--bg-subtle);color:var(--fg-2);border:1px solid var(--border-2);font:500 12px/1 var(--font-sans);letter-spacing:.015em"><span style="width:6px;height:6px;border-radius:50%;background:var(--fg-2)"></span>Aguardando</span>
  </div>
  <div style="display:flex;gap:8px;align-items:center">
    <span style="font:500 11px/1 var(--font-sans);color:var(--fg-3);text-transform:uppercase;letter-spacing:.08em">Pagamento</span>
    <span style="display:inline-flex;align-items:center;height:22px;padding:0 10px;border-radius:9999px;background:var(--color-success-bg);color:var(--color-success-fg);border:1px solid var(--color-success-border);font:500 11px/1 var(--font-sans);letter-spacing:.015em">Pago</span><span style="display:inline-flex;align-items:center;height:22px;padding:0 10px;border-radius:9999px;background:var(--color-warning-bg);color:var(--color-warning-fg);border:1px solid var(--color-warning-border);font:500 11px/1 var(--font-sans);letter-spacing:.015em">Pendente</span><span style="display:inline-flex;align-items:center;height:22px;padding:0 10px;border-radius:9999px;background:var(--color-danger-bg);color:var(--color-danger-fg);border:1px solid var(--color-danger-border);font:500 11px/1 var(--font-sans);letter-spacing:.015em">Recusado</span><span style="display:inline-flex;align-items:center;height:22px;padding:0 10px;border-radius:9999px;background:var(--bg-subtle);color:var(--fg-2);border:1px solid var(--border-2);font:500 11px/1 var(--font-sans);letter-spacing:.015em">Estornado</span>
  </div>
</body></html>
