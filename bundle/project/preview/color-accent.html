<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="padding:20px 24px;display:flex;flex-direction:column;gap:12px;justify-content:center">
  <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px">
    <div style="display:flex;flex-direction:column;gap:6px">
      <div style="height:48px;border-radius:8px;background:var(--color-accent-50);border:1px solid rgba(0,0,0,.06)"></div>
      <div style="font:500 10px/1 var(--font-sans);color:var(--fg-3);text-align:center">50</div>
    </div><div style="display:flex;flex-direction:column;gap:6px">
      <div style="height:48px;border-radius:8px;background:var(--color-accent-100);border:1px solid rgba(0,0,0,.06)"></div>
      <div style="font:500 10px/1 var(--font-sans);color:var(--fg-3);text-align:center">100</div>
    </div><div style="display:flex;flex-direction:column;gap:6px">
      <div style="height:48px;border-radius:8px;background:var(--color-accent-300);border:1px solid rgba(0,0,0,.06)"></div>
      <div style="font:500 10px/1 var(--font-sans);color:var(--fg-3);text-align:center">300</div>
    </div><div style="display:flex;flex-direction:column;gap:6px">
      <div style="height:48px;border-radius:8px;background:var(--color-accent-500);"></div>
      <div style="font:500 10px/1 var(--font-sans);color:var(--fg-3);text-align:center">500</div>
    </div><div style="display:flex;flex-direction:column;gap:6px">
      <div style="height:48px;border-radius:8px;background:var(--color-accent-600);"></div>
      <div style="font:500 10px/1 var(--font-sans);color:var(--fg-3);text-align:center">600</div>
    </div><div style="display:flex;flex-direction:column;gap:6px">
      <div style="height:48px;border-radius:8px;background:var(--color-accent-700);"></div>
      <div style="font:500 10px/1 var(--font-sans);color:var(--fg-3);text-align:center">700</div>
    </div>
    <div style="display:flex;flex-direction:column;justify-content:center;gap:4px;padding-left:8px">
      <span style="display:inline-flex;align-items:center;justify-content:center;height:24px;padding:0 10px;border-radius:9999px;background:var(--color-accent-500);color:#fff;font:600 11px/1 var(--font-sans);width:max-content">−30%</span>
      <span style="font:500 10px/1 var(--font-sans);color:var(--fg-3)">deal pill</span>
    </div>
  </div>
  <div style="display:flex;justify-content:space-between;align-items:center">
    <span style="font:600 13px/1 var(--font-sans);color:var(--fg-1)">Accent · clementine (deals only)</span>
    <span style="font:400 12px/1 var(--font-mono);color:var(--fg-3)">#F38744</span>
  </div>
</body></html>
