<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="padding:20px 24px;display:flex;flex-direction:column;gap:10px;justify-content:center">
  <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px">
    <div style="display:flex;flex-direction:column;gap:6px">
      <div style="height:48px;border-radius:10px;background:#0B0119;"></div>
      <div style="font:500 10px/1 var(--font-sans);color:var(--fg-3);text-align:center">ink</div>
    </div><div style="display:flex;flex-direction:column;gap:6px">
      <div style="height:48px;border-radius:10px;background:#14081f;"></div>
      <div style="font:500 10px/1 var(--font-sans);color:var(--fg-3);text-align:center">ink-95</div>
    </div><div style="display:flex;flex-direction:column;gap:6px">
      <div style="height:48px;border-radius:10px;background:#1c1028;"></div>
      <div style="font:500 10px/1 var(--font-sans);color:var(--fg-3);text-align:center">ink-90</div>
    </div><div style="display:flex;flex-direction:column;gap:6px">
      <div style="height:48px;border-radius:10px;background:#2b1f3a;"></div>
      <div style="font:500 10px/1 var(--font-sans);color:var(--fg-3);text-align:center">ink-80</div>
    </div><div style="display:flex;flex-direction:column;gap:6px">
      <div style="height:48px;border-radius:10px;background:#4a3f59;"></div>
      <div style="font:500 10px/1 var(--font-sans);color:var(--fg-3);text-align:center">ink-60</div>
    </div><div style="display:flex;flex-direction:column;gap:6px">
      <div style="height:48px;border-radius:10px;background:#7a7184;"></div>
      <div style="font:500 10px/1 var(--font-sans);color:var(--fg-3);text-align:center">ink-40</div>
    </div><div style="display:flex;flex-direction:column;gap:6px">
      <div style="height:48px;border-radius:10px;background:#c5c1cb;border:1px solid rgba(0,0,0,.06)"></div>
      <div style="font:500 10px/1 var(--font-sans);color:var(--fg-3);text-align:center">ink-20</div>
    </div>
  </div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px">
    <span style="font:600 13px/1 var(--font-sans);color:var(--fg-1)">Ink • deep plum near-black</span>
    <span style="font:400 12px/1 var(--font-mono);color:var(--fg-3)">--color-ink · #0B0119</span>
  </div>
</body></html>
