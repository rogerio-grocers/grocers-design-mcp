<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="padding:0;display:flex;align-items:center;justify-content:center;background:rgba(11,1,25,0.55);min-height:100%">
  <div style="width:440px;background:#fff;border-radius:18px;box-shadow:var(--shadow-xl);overflow:hidden">
    <div style="padding:22px 24px 6px;display:flex;align-items:flex-start;gap:14px">
      <div style="width:38px;height:38px;border-radius:10px;background:var(--color-warning-bg);color:var(--color-warning-fg);display:inline-flex;align-items:center;justify-content:center;flex:0 0 38px;border:1px solid var(--color-warning-border)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      </div>
      <div style="flex:1">
        <div style="font:500 16px/1.3 var(--font-sans);color:var(--fg-1)">Cancelar pedido #GRC-48201?</div>
        <div style="font:400 13px/1.5 var(--font-sans);color:var(--fg-2);margin-top:4px">Esta ação não pode ser desfeita. O cliente receberá um e-mail e o valor será estornado em até 5 dias úteis.</div>
      </div>
      <button style="width:28px;height:28px;background:transparent;border:0;color:var(--fg-3);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;border-radius:8px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div style="padding:16px 24px 0">
      <label style="display:flex;align-items:flex-start;gap:10px;padding:12px;background:var(--bg-subtle);border-radius:10px;cursor:pointer">
        <span style="width:18px;height:18px;border-radius:5px;background:var(--color-ink);color:#fff;display:inline-flex;align-items:center;justify-content:center;margin-top:1px;flex:0 0 18px"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
        <span style="font:400 13px/1.4 var(--font-sans);color:var(--fg-1)">Notificar cliente por WhatsApp</span>
      </label>
    </div>

    <!-- Type-to-confirm input for destructive action -->
    <div style="padding:14px 24px 0;display:flex;flex-direction:column;gap:6px">
      <span style="font:400 12px/1.2 var(--font-sans);color:var(--fg-2)">Digite <b style="font:500 12px/1 var(--font-mono);color:var(--fg-1);background:var(--bg-subtle);padding:2px 5px;border-radius:4px">CANCELAR</b> para confirmar</span>
      <input value="CANCELAR" style="height:38px;padding:0 12px;background:#fff;border:1.5px solid var(--color-ink);border-radius:10px;font:500 13px/1 var(--font-mono);color:var(--fg-1);letter-spacing:.04em;box-shadow:var(--shadow-focus);outline:0">
    </div>

    <div style="padding:18px 24px 22px;display:flex;justify-content:flex-end;gap:8px;margin-top:6px">
      <button style="height:38px;padding:0 16px;background:#fff;color:var(--fg-1);border:1px solid var(--border-2);border-radius:10px;font:500 13px/1 var(--font-sans);cursor:pointer">Manter pedido</button>
      <button style="display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 16px;background:var(--color-ink);color:#fff;border:0;border-radius:10px;font:500 13px/1 var(--font-sans);cursor:pointer">
        Cancelar pedido
      </button>
    </div>
  </div>
</body></html>
